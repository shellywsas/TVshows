<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעקב הסדרות שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #f8fafc;
        }
        /* אנימציות מעבר עדינות */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* עיצוב פס הגלילה */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">

<div id="customModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/50 backdrop-blur-sm transition-opacity opacity-0">
    <div id="modalContentBox" class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-all duration-300">
        <h3 id="modalTitle" class="text-2xl font-bold text-slate-800 mb-2">כותרת</h3>
        <p id="modalMessage" class="text-slate-600 mb-6 text-lg">הודעה</p>
        
        <!-- אזור טקסט לעריכה -->
        <div id="modalInputContainer" class="hidden mb-6">
            <input type="text" id="modalInput" class="w-full p-4 rounded-xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-0 outline-none text-lg transition-colors" placeholder="הקלד/י כאן...">
            <p id="modalError" class="hidden text-red-500 text-sm mt-2 font-medium"></p>
        </div>

        <div class="flex justify-end gap-3 mt-4">
            <button id="modalCancelBtn" class="px-5 py-2.5 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors hidden">ביטול</button>
            <button id="modalConfirmBtn" class="px-5 py-2.5 rounded-xl font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-md hover:shadow-lg">אישור</button>
        </div>
    </div>
</div>

<div class="max-w-4xl mx-auto p-4 md:p-8">
    
    <div id="homeScreen" class="fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-l from-indigo-600 to-purple-600 mb-4 tracking-tight">מעקב הסדרות שלי 📺</h1>
            <p class="text-slate-500 text-lg">המקום שלך לתעד את כל מה שראית</p>
        </div>

        <!-- כרטיסיות סטטיסטיקה -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center transform hover:-translate-y-1 transition-transform">
                <span id="statTotal" class="text-5xl font-black text-indigo-600 mb-2">0</span>
                <span class="text-slate-500 font-medium">סה"כ סדרות</span>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center transform hover:-translate-y-1 transition-transform">
                <span id="statIsrael" class="text-5xl font-black text-emerald-500 mb-2">0</span>
                <span class="text-slate-500 font-medium">הופק בישראל 🇮🇱</span>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center justify-center transform hover:-translate-y-1 transition-transform">
                <span id="statAbroad" class="text-5xl font-black text-amber-500 mb-2">0</span>
                <span class="text-slate-500 font-medium">הופק בחו"ל ✈️</span>
            </div>
        </div>

        <!-- טופס הוספה -->
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 mb-8">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">הוספת סדרה חדשה</h2>
            <form id="addForm" class="flex flex-col gap-6">
                <div>
                    <input type="text" id="seriesInput" class="w-full p-4 text-lg rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none transition-colors bg-slate-50 focus:bg-white" placeholder="שם הסדרה (לדוגמה: קופה ראשית, חברים...)" required>
                </div>
                
                <div class="flex flex-wrap gap-4">
                    <label class="flex-1 relative">
                        <input type="radio" name="origin" value="israel" class="peer sr-only" checked>
                        <div class="p-4 text-center rounded-xl border-2 border-slate-200 cursor-pointer transition-all peer-checked:border-emerald-500 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 font-medium text-slate-600 hover:bg-slate-50">
                            סדרה ישראלית 🇮🇱
                        </div>
                    </label>
                    <label class="flex-1 relative">
                        <input type="radio" name="origin" value="abroad" class="peer sr-only">
                        <div class="p-4 text-center rounded-xl border-2 border-slate-200 cursor-pointer transition-all peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 font-medium text-slate-600 hover:bg-slate-50">
                            סדרה מחו"ל ✈️
                        </div>
                    </label>
                </div>

                <button type="submit" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-lg transition-colors shadow-md hover:shadow-xl flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    הוסף לרשימה
                </button>
            </form>
        </div>

        <!-- מעבר לרשימה -->
        <button id="goToListBtn" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-lg transition-colors shadow-md flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" /></svg>
            לכל הסדרות שלי
        </button>
    </div>

    <div id="listScreen" class="hidden fade-in pb-20">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-bold text-slate-800">הסדרות שלי</h2>
            <button id="backToHomeBtn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg font-medium transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                חזרה להוספה
            </button>
        </div>

        <div class="bg-white p-4 md:p-6 rounded-3xl shadow-sm border border-slate-100">
            <!-- סרגל כלים: סינון ומיון -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                <!-- סינון -->
                <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                    <button class="filter-btn flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold bg-white text-indigo-600 shadow-sm transition-all focus:outline-none" data-filter="all">הכל</button>
                    <button class="filter-btn flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-800 transition-all focus:outline-none" data-filter="israel">ישראל 🇮🇱</button>
                    <button class="filter-btn flex-1 md:flex-none px-6 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-800 transition-all focus:outline-none" data-filter="abroad">חו"ל ✈️</button>
                </div>
                
                <!-- מיון -->
                <div class="flex items-center gap-3 w-full md:w-auto bg-slate-100 p-2 rounded-xl">
                    <span class="text-sm font-bold text-slate-500 px-2">מיון:</span>
                    <select id="sortSelect" class="bg-white border-none text-slate-700 text-sm font-bold rounded-lg focus:ring-2 focus:ring-indigo-500 block px-4 py-2 w-full md:w-auto outline-none cursor-pointer shadow-sm">
                        <option value="dateDesc">הכי חדש קודם</option>
                        <option value="dateAsc">הכי ישן קודם</option>
                        <option value="alpha">א-ב / A-Z</option>
                    </select>
                </div>
            </div>

            <!-- רשימה ריקה -->
            <div id="emptyState" class="hidden text-center py-16 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-200">
                <div class="text-5xl mb-4">🔍</div>
                <h3 class="text-xl font-bold text-slate-700 mb-2">אין כאן כלום כרגע</h3>
                <p class="text-slate-500">נסה/י לשנות את אפשרויות הסינון או להוסיף סדרות חדשות.</p>
            </div>

            <!-- הרשימה עצמה -->
            <ul id="seriesList" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- פריטים יתווספו לכאן -->
            </ul>
        </div>
    </div>
</div>

<script>
    // --- משתני מדינה (State) ---
    // לכל סדרה יש מזהה ייחודי כדי שנוכל לערוך ולמחוק בקלות גם אחרי מיון/סינון
    let seriesData = JSON.parse(localStorage.getItem('mySeriesDb')) || [];
    let currentFilter = 'all'; // 'all', 'israel', 'abroad'
    let currentSort = 'dateDesc'; // 'dateDesc', 'dateAsc', 'alpha'

    // מיגרציה לנתונים ישנים (אם היה לך שמור מהקוד הקודם, נוסיף להם ID ותאריך)
    const legacyData = JSON.parse(localStorage.getItem('mySeries'));
    if (legacyData && legacyData.length > 0 && seriesData.length === 0) {
        seriesData = legacyData.map((s, index) => ({
            id: Date.now().toString() + index,
            name: s.name,
            origin: s.origin,
            createdAt: Date.now() + index
        }));
        saveData();
        localStorage.removeItem('mySeries'); // ניקוי הישן
    }

    // אלמנטים ב-DOM
    const homeScreen = document.getElementById('homeScreen');
    const listScreen = document.getElementById('listScreen');
    const goToListBtn = document.getElementById('goToListBtn');
    const backToHomeBtn = document.getElementById('backToHomeBtn');
    const addForm = document.getElementById('addForm');
    const seriesInput = document.getElementById('seriesInput');
    const seriesList = document.getElementById('seriesList');
    const emptyState = document.getElementById('emptyState');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const sortSelect = document.getElementById('sortSelect');

    // אלמנטים מודאל
    const modal = document.getElementById('customModal');
    const modalContentBox = document.getElementById('modalContentBox');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalInputContainer = document.getElementById('modalInputContainer');
    const modalInput = document.getElementById('modalInput');
    const modalError = document.getElementById('modalError');
    const modalConfirmBtn = document.getElementById('modalConfirmBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');

    let modalConfirmCallback = null;

    // --- פונקציות עזר ---

    function saveData() {
        localStorage.setItem('mySeriesDb', JSON.stringify(seriesData));
    }

    // ניהול מסכים
    goToListBtn.addEventListener('click', () => {
        homeScreen.classList.add('hidden');
        listScreen.classList.remove('hidden');
        renderList();
    });

    backToHomeBtn.addEventListener('click', () => {
        listScreen.classList.add('hidden');
        homeScreen.classList.remove('hidden');
        updateHomeStats();
    });

    // --- מערכת חלונות קופצים (Modal) ---
    function openModal(options) {
        const { title, message, type = 'info', defaultValue = '', onConfirm } = options;
        
        modalTitle.textContent = title;
        modalConfirmCallback = onConfirm;
        modalError.classList.add('hidden');

        // עיצוב לפי סוג
        if (type === 'edit') {
            modalMessage.classList.add('hidden');
            modalInputContainer.classList.remove('hidden');
            modalInput.value = defaultValue;
            modalCancelBtn.classList.remove('hidden');
            
            modalConfirmBtn.textContent = 'שמירה';
            modalConfirmBtn.className = 'px-5 py-2.5 rounded-xl font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-md';
        } else if (type === 'confirm') {
            modalMessage.classList.remove('hidden');
            modalMessage.textContent = message;
            modalInputContainer.classList.add('hidden');
            modalCancelBtn.classList.remove('hidden');
            
            modalConfirmBtn.textContent = 'כן, מחק';
            modalConfirmBtn.className = 'px-5 py-2.5 rounded-xl font-medium text-white bg-red-500 hover:bg-red-600 transition-colors shadow-md';
        } else {
            // רגיל (שגיאה/מידע)
            modalMessage.classList.remove('hidden');
            modalMessage.textContent = message;
            modalInputContainer.classList.add('hidden');
            modalCancelBtn.classList.add('hidden');
            
            modalConfirmBtn.textContent = 'הבנתי';
            modalConfirmBtn.className = 'px-5 py-2.5 rounded-xl font-medium text-white bg-indigo-600 hover:bg-indigo-700 transition-colors shadow-md';
        }

        // הצגת מודאל באנימציה
        modal.classList.remove('hidden');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContentBox.classList.remove('scale-95');
        }, 10);
    }

    function closeModal() {
        modal.classList.add('opacity-0');
        modalContentBox.classList.add('scale-95');
        setTimeout(() => {
            modal.classList.add('hidden');
            modalConfirmCallback = null;
        }, 300);
    }

    modalCancelBtn.addEventListener('click', closeModal);
    modalConfirmBtn.addEventListener('click', () => {
        if (!modalInputContainer.classList.contains('hidden')) {
            // זה מצב עריכה
            const newVal = modalInput.value.trim();
            if (!newVal) {
                modalError.textContent = 'שם הסדרה לא יכול להיות ריק';
                modalError.classList.remove('hidden');
                return;
            }
            if (modalConfirmCallback) {
                const isValid = modalConfirmCallback(newVal);
                if (!isValid) return; // Callback החזיר false בגלל שגיאה/כפילות
            }
        } else {
            if (modalConfirmCallback) modalConfirmCallback();
        }
        closeModal();
    });


    // --- פעולות מרכזיות (הוספה, עריכה, מחיקה) ---

    // הוספה
    addForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = seriesInput.value.trim();
        const origin = document.querySelector('input[name="origin"]:checked').value;

        // בדיקת כפילות
        const exists = seriesData.some(s => s.name.toLowerCase() === name.toLowerCase());
        if (exists) {
            openModal({
                title: 'אופס!',
                message: `הסדרה "${name}" כבר קיימת ברשימה שלך. אפשר להוסיף אותה בשפה אחרת אם מדובר בסדרה שונה.`,
                type: 'info'
            });
            return;
        }

        // שמירה
        seriesData.push({
            id: Date.now().toString(),
            name: name,
            origin: origin,
            createdAt: Date.now()
        });
        saveData();
        
        seriesInput.value = ''; // איפוס
        updateHomeStats();
        // הערה: ביטלנו את הקופץ של "נוסף בהצלחה" כבקשתך. זה רק יעדכן את המספרים.
    });

    // מחיקה
    window.deleteSeries = function(id) {
        const item = seriesData.find(s => s.id === id);
        if(!item) return;

        openModal({
            title: 'מחיקת סדרה',
            message: `בטוחה שאת רוצה למחוק את "${item.name}" מהרשימה?`,
            type: 'confirm',
            onConfirm: () => {
                seriesData = seriesData.filter(s => s.id !== id);
                saveData();
                renderList();
                updateHomeStats();
            }
        });
    }

    // עריכה
    window.editSeries = function(id) {
        const itemIndex = seriesData.findIndex(s => s.id === id);
        if(itemIndex === -1) return;
        
        const currentName = seriesData[itemIndex].name;

        openModal({
            title: 'עריכת שם הסדרה',
            type: 'edit',
            defaultValue: currentName,
            onConfirm: (newName) => {
                // בדיקת כפילות מתעלמת מהסדרה הנוכחית
                const exists = seriesData.some((s, idx) => idx !== itemIndex && s.name.toLowerCase() === newName.toLowerCase());
                if (exists) {
                    modalError.textContent = `השם "${newName}" כבר קיים ברשימה.`;
                    modalError.classList.remove('hidden');
                    return false; // מונע סגירה
                }
                
                seriesData[itemIndex].name = newName;
                saveData();
                renderList();
                return true; // מאשר סגירה
            }
        });
    }

    // --- רינדור ותצוגה ---

    function updateHomeStats() {
        document.getElementById('statTotal').textContent = seriesData.length;
        document.getElementById('statIsrael').textContent = seriesData.filter(s => s.origin === 'israel').length;
        document.getElementById('statAbroad').textContent = seriesData.filter(s => s.origin === 'abroad').length;
    }

    // מאזינים לסינון ומיון
    filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            // עדכון עיצוב כפתורים
            filterBtns.forEach(b => {
                b.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                b.classList.add('text-slate-500');
            });
            const target = e.target;
            target.classList.remove('text-slate-500');
            target.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');

            currentFilter = target.dataset.filter;
            renderList();
        });
    });

    sortSelect.addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderList();
    });

    function renderList() {
        seriesList.innerHTML = '';
        
        // שלב 1: סינון
        let filtered = seriesData.filter(s => {
            if (currentFilter === 'all') return true;
            return s.origin === currentFilter;
        });

        // שלב 2: מיון
        filtered.sort((a, b) => {
            if (currentSort === 'dateDesc') return b.createdAt - a.createdAt; // חדש קודם
            if (currentSort === 'dateAsc') return a.createdAt - b.createdAt; // ישן קודם
            if (currentSort === 'alpha') return a.name.localeCompare(b.name, 'he', { sensitivity: 'base' }); // א-ב
            return 0;
        });

        // שלב 3: ציור למסך
        if (filtered.length === 0) {
            emptyState.classList.remove('hidden');
        } else {
            emptyState.classList.add('hidden');
            
            filtered.forEach(series => {
                const isIsrael = series.origin === 'israel';
                const borderColor = isIsrael ? 'border-r-emerald-500' : 'border-r-amber-500';
                const badgeStyle = isIsrael ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200';
                const badgeText = isIsrael ? 'ישראל 🇮🇱' : 'חו"ל ✈️';

                const li = document.createElement('li');
                li.className = `flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-4 md:p-5 bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-md transition-shadow border-r-4 ${borderColor}`;
                
                li.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <h4 class="text-xl font-bold text-slate-800 break-words">${series.name}</h4>
                        <span class="px-3 py-1 text-xs font-bold rounded-full border whitespace-nowrap ${badgeStyle}">${badgeText}</span>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-auto">
                        <button onclick="editSeries('${series.id}')" class="p-2.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-200" title="ערוך סדרה">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                        </button>
                        <button onclick="deleteSeries('${series.id}')" class="p-2.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-red-200" title="מחק סדרה">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                        </button>
                    </div>
                `;
                seriesList.appendChild(li);
            });
        }
    }

    // אתחול בעת טעינה
    updateHomeStats();
</script>

</body>
</html>
